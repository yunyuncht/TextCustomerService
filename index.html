<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Customer Service Test Page</title>
    <style>
      :root {
        --bg-1: #f7f4ec;
        --bg-2: #dfe8d8;
        --ink: #1f2a2a;
        --muted: #4b5d5c;
        --panel: rgba(255, 255, 255, 0.74);
        --line: rgba(31, 42, 42, 0.16);
        --accent: #167f6b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 16%, #fff3 0 12%, transparent 12.5%),
          radial-gradient(circle at 82% 78%, #fff4 0 10%, transparent 10.5%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(920px, 100%);
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--panel);
        backdrop-filter: blur(6px);
        box-shadow: 0 18px 48px rgba(25, 44, 38, 0.15);
        overflow: hidden;
        animation: rise-in 0.7s ease-out both;
      }

      .header {
        padding: 28px 28px 18px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 10px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.35rem, 3.5vw, 2rem);
        line-height: 1.2;
      }

      .sub {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .embed-area {
        padding: 22px;
      }

      .embed-shell {
        border: 1px dashed var(--line);
        border-radius: 16px;
        padding: 22px;
        min-height: 460px;
        background: rgba(255, 255, 255, 0.67);
        display: grid;
        align-items: center;
      }

      .launcher {
        max-width: 540px;
        margin: 0 auto;
        text-align: center;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(22, 127, 107, 0.1);
        color: var(--accent);
        font-size: 0.92rem;
        font-weight: 700;
      }

      .status::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: currentColor;
      }

      .launcher h2 {
        margin: 18px 0 10px;
        font-size: clamp(1.2rem, 3vw, 1.7rem);
      }

      .launcher p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .actions {
        margin-top: 24px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 14px 22px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-primary {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 12px 24px rgba(22, 127, 107, 0.22);
      }

      .btn-secondary {
        background: rgba(31, 42, 42, 0.08);
        color: var(--ink);
      }

      .runtime-note {
        margin-top: 18px;
        min-height: 24px;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .tip {
        margin: 14px 0 0;
        font-size: 0.9rem;
        color: var(--muted);
      }

      /* Chat Widget Styles */
      .chat-bubble {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(22, 127, 107, 0.3);
        z-index: 1000000;
        font-size: 28px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .chat-bubble:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 20px rgba(22, 127, 107, 0.4);
      }

      .chat-window {
        position: fixed;
        bottom: 100px;
        right: 24px;
        width: 360px;
        height: 500px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 5px 40px rgba(25, 44, 38, 0.2);
        display: flex;
        flex-direction: column;
        z-index: 999999;
        opacity: 0;
        visibility: hidden;
        transform: translateY(20px) scale(0.95);
        transition: all 0.3s ease;
      }

      .chat-window.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }

      .chat-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--accent);
        color: #fff;
        border-radius: 12px 12px 0 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .chat-header h3 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 700;
      }

      .chat-close {
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        padding: 0;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.2s ease;
      }

      .chat-close:hover {
        opacity: 0.8;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        display: flex;
        gap: 8px;
        animation: messageSlide 0.3s ease;
      }

      .message.bot {
        justify-content: flex-start;
      }

      .message.user {
        justify-content: flex-end;
      }

      .message-bubble {
        max-width: 75%;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 0.95rem;
        line-height: 1.4;
        word-wrap: break-word;
      }

      .message.bot .message-bubble {
        background: rgba(22, 127, 107, 0.1);
        color: var(--ink);
      }

      .message.user .message-bubble {
        background: var(--accent);
        color: #fff;
      }

      @keyframes messageSlide {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .chat-input-area {
        padding: 14px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }

      .chat-input {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 12px;
        font-family: inherit;
        font-size: 0.95rem;
        resize: none;
        outline: none;
      }

      .chat-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(22, 127, 107, 0.1);
      }

      .chat-send {
        background: var(--accent);
        border: none;
        color: #fff;
        border-radius: 6px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 700;
        transition: opacity 0.2s ease;
      }

      .chat-send:hover {
        opacity: 0.9;
      }

      /* Hide Pathors branding */
      [src*="pathors.com"] ~ * [class*="logo"],
      [src*="pathors.com"] ~ * [class*="header"],
      [src*="pathors.com"] ~ * [class*="powered"],
      iframe[src*="pathors"] {
        display: none !important;
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (max-width: 640px) {
        body {
          padding: 14px;
        }

        .header {
          padding: 20px 16px 14px;
        }

        .embed-area {
          padding: 14px;
        }

        .embed-shell {
          min-height: 520px;
          padding: 10px;
        }

        .actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <section class="header">
        <p class="eyebrow">Sandbox</p>
        <h1>Text Customer Service Experience Page</h1>
        <p class="sub">
          Use this page to test the text-based customer support flow.
        </p>
      </section>

      <section class="embed-area">
        <div class="embed-shell">
          <div class="launcher">
            <div class="status">Customer Service Ready</div>
            <h2>智能客服</h2>
            <p>
              點擊右下角的對話框按鈕，開始與我們的智能客服聊天。我們隨時準備幫助您解決問題。
            </p>
          </div>
        </div>
      </section>
    </main>
    <!-- Chat Widget -->
    <div class="chat-bubble" id="chat-bubble" title="Open chat">💬</div>
    <div class="chat-window" id="chat-window">
      <div class="chat-header">
        <h3>智能客服</h3>
        <button class="chat-close" id="chat-close">✕</button>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="message bot">
          <div class="message-bubble">
            您好！👋 歡迎來到我們的客服中心。請問有什麼我可以幫助您的嗎？
          </div>
        </div>
      </div>
      <div class="chat-input-area">
        <input
          type="text"
          class="chat-input"
          id="chat-input"
          placeholder="輸入您的問題..."
          aria-label="Type your message"
        />
        <button class="chat-send" id="chat-send" title="Send message">送出</button>
      </div>
    </div>

    <script>
      const chatBubble = document.getElementById("chat-bubble");
      const chatWindow = document.getElementById("chat-window");
      const chatClose = document.getElementById("chat-close");
      const chatInput = document.getElementById("chat-input");
      const chatSend = document.getElementById("chat-send");
      const chatMessages = document.getElementById("chat-messages");

      let isChatOpen = false;

      // Toggle chat window
      chatBubble.addEventListener("click", () => {
        isChatOpen = !isChatOpen;
        chatWindow.classList.toggle("active", isChatOpen);
        if (isChatOpen) {
          chatInput.focus();
        }
      });

      // Close chat window
      chatClose.addEventListener("click", (e) => {
        e.stopPropagation();
        isChatOpen = false;
        chatWindow.classList.remove("active");
      });

      // Send message
      const sendMessage = () => {
        const text = chatInput.value.trim();
        if (!text) return;

        // Add user message
        const userMsg = document.createElement("div");
        userMsg.className = "message user";
        userMsg.innerHTML = `<div class="message-bubble">${text}</div>`;
        chatMessages.appendChild(userMsg);

        chatInput.value = "";
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // Simulate bot response after a delay
        setTimeout(() => {
          const botMsg = document.createElement("div");
          botMsg.className = "message bot";
          const responses = [
            "感謝您的提問！我正在處理您的問題。",
            "這是個很好的問題。請稍候，我查詢相關資訊。",
            "我理解您的需求。請告訴我更多細節好嗎？",
            "我會盡快為您提供幫助。謝謝您的耐心！"
          ];
          const randomResponse = responses[Math.floor(Math.random() * responses.length)];
          botMsg.innerHTML = `<div class="message-bubble">${randomResponse}</div>`;
          chatMessages.appendChild(botMsg);
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 500);
      };

      chatSend.addEventListener("click", sendMessage);
      chatInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    </script>

    <script
      src="https://app.pathors.com/embed.js"
      data-project-id="a7900646-87ee-445b-baf8-a07d1e0e41a4"
    ></script>
  </body>
</html>
