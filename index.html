<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Customer Service Test Page</title>
    <style>
      :root {
        --bg-1: #f7f4ec;
        --bg-2: #dfe8d8;
        --ink: #1f2a2a;
        --muted: #4b5d5c;
        --panel: rgba(255, 255, 255, 0.74);
        --line: rgba(31, 42, 42, 0.16);
        --accent: #167f6b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 16%, #fff3 0 12%, transparent 12.5%),
          radial-gradient(circle at 82% 78%, #fff4 0 10%, transparent 10.5%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(920px, 100%);
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--panel);
        backdrop-filter: blur(6px);
        box-shadow: 0 18px 48px rgba(25, 44, 38, 0.15);
        overflow: hidden;
        animation: rise-in 0.7s ease-out both;
      }

      .header {
        padding: 28px 28px 18px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 10px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.35rem, 3.5vw, 2rem);
        line-height: 1.2;
      }

      .sub {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .embed-area {
        padding: 22px;
      }

      .embed-shell {
        border: 1px dashed var(--line);
        border-radius: 16px;
        padding: 22px;
        min-height: 460px;
        background: rgba(255, 255, 255, 0.67);
        display: grid;
        align-items: center;
      }

      .launcher {
        max-width: 540px;
        margin: 0 auto;
        text-align: center;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(22, 127, 107, 0.1);
        color: var(--accent);
        font-size: 0.92rem;
        font-weight: 700;
      }

      .status::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: currentColor;
      }

      .launcher h2 {
        margin: 18px 0 10px;
        font-size: clamp(1.2rem, 3vw, 1.7rem);
      }

      .launcher p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .actions {
        margin-top: 24px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 14px 22px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-primary {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 12px 24px rgba(22, 127, 107, 0.22);
      }

      .btn-secondary {
        background: rgba(31, 42, 42, 0.08);
        color: var(--ink);
      }

      .runtime-note {
        margin-top: 18px;
        min-height: 24px;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .tip {
        margin: 14px 0 0;
        font-size: 0.9rem;
        color: var(--muted);
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (max-width: 640px) {
        body {
          padding: 14px;
        }

        .header {
          padding: 20px 16px 14px;
        }

        .embed-area {
          padding: 14px;
        }

        .embed-shell {
          min-height: 520px;
          padding: 10px;
        }

        .actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <section class="header">
        <p class="eyebrow">Sandbox</p>
        <h1>Text Customer Service Experience Page</h1>
        <p class="sub">
          Use this page to test the text-based customer support flow.
        </p>
      </section>

      <section class="embed-area">
        <div class="embed-shell"></div>
      </section>
    </main>

    <script
      src="https://app.pathors.com/embed.js"
      data-project-id="a7900646-87ee-445b-baf8-a07d1e0e41a4"
    ></script>
  </body>
</html>
